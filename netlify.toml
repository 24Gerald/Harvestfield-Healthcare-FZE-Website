# Netlify configuration for harvestfieldhealthcare.com
# Connect the repo in the Netlify UI, then point the custom domain at this site.
# Docs: https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Single-page app: every route (including /legal) is served by index.html.
# Netlify Forms are detected from the static form in public/__forms.html,
# which is copied to dist/ at build time — keep that file in sync with the
# fields in src/sections/RequestSupply.jsx.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Long-lived caching for hashed build assets, short for the HTML shell.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
